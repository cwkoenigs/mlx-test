[project]
name = "mlx-cluster"
version = "0.1.0"
description = "MLX deep learning (training + distributed) on a two-Mac Thunderbolt cluster"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.3",
    "pyyaml>=6.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Linux-only CPU build of MLX so the repo can be smoke-tested off-Mac (CI, cloud sessions).
cpu = ["mlx-cpu==0.32.3; sys_platform == 'linux'"]
# Optional Phase 5 (LoRA fine-tuning check with mlx-lm). Not needed for the core experiment.
llm = ["mlx-lm==0.32.0"]
# Optional PyTorch-on-MPS baseline (Phase 1 framework comparison).
torch = ["torch>=2.5", "lightning>=2.4"]
# Synthetic CMD array generator (scripts/generate_synthetic_cmd_arrays.py): parquet labels file.
cmd = ["pyarrow>=17"]

[dependency-groups]
# Installed by a plain `uv sync` on the Macs (default group): the PyTorch/Lightning TCN and the
# pyarrow the CMD generator needs. Linux keeps the lean MLX-only environment.
mac = ["torch>=2.5; sys_platform == 'darwin'", "lightning>=2.4; sys_platform == 'darwin'", "pyarrow; sys_platform == 'darwin'"]

[tool.uv]
package = false
default-groups = ["mac"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
